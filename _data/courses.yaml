stat940:
  code: "STAT 940"
  title: "Deep Learning"
  term: "Fall 2026"
  instructor: "Ali Ghodsi"
  meetings: "Tuesdays and Thursdays, 1:00-2:20 p.m."
  location: "MC 4063"
  description: "A graduate-level course on the foundations, architectures, optimization methods, and modern applications of deep learning."
  piazza_url: "https://piazza.com/class/mtvh6kt24dj3a8"
  d2l_url: "https://learn.uwaterloo.ca/"
  outline_url: "/assets/pdfs/stat940_outline.pdf"
  textbook:
    authors: "Benyamin Ghojogh and Ali Ghodsi"
    title: "Elements of Deep Learning"
    publisher: "Springer, 2026"
    isbn: "978-3-032-10738-1"
    format: "eBook"
    url: "https://link.springer.com/book/10.1007/978-3-032-10738-1"
  assessment_breakdown:
    - component: "Assignments"
      weight: "45%"
    - component: "Paper presentation"
      weight: "10%"
    - component: "Group final project"
      weight: "45%"
    - component: "Total"
      weight: "100%"
  assessment_dates:
    - assessment: "Assignment 1"
      release: "Monday, October 5"
      due: "Monday, October 19, 11:59 p.m."
    - assessment: "Assignment 2"
      release: "Monday, November 2"
      due: "Monday, November 16, 11:59 p.m."
    - assessment: "Assignment 3"
      release: "Monday, November 23"
      due: "Monday, December 7, 11:59 p.m."
    - assessment: "Paper presentation"
      release: "Eligible venues specified in the course outline"
      due: "Scheduled presentation date"
    - assessment: "Group final project"
      release: "To be announced"
      due: "Monday, December 21, 11:59 p.m."
  assessment_dates_note: "All dates are tentative and may change. Changes will be announced."
  lecture_schedule_note: "This tentative schedule follows the lecture sequence in the course materials; textbook references provide supporting readings."
  lecture_schedule:
    - title: "Lecture 1 - Motivation, history, machine-learning foundations, and a neural-network overview"
      alignment: "Ch. 1, Secs. 1-5; Ch. 2, Secs. 2.1-2.7"
      slides: "/assets/pdfs/stat940_lecture_1.pdf"
      slides_label: "Lecture 1 slides"
    - title: "Lecture 2 - Neural-network history, McCulloch-Pitts networks, the perceptron and linear separability, feedforward neural networks, and backpropagation"
      alignment: "Ch. 1, Sec. 5; Ch. 2, Secs. 2.2-2.7; Ch. 3, Secs. 2-3"
      slides: "/assets/pdfs/stat940_lecture_2.pdf"
      slides_label: "Lecture 2 slides"
    - title: "Lecture 3 - Stochastic gradient descent, mini-batches, learning-rate tuning, momentum, optimizer selection, and first- versus second-order methods"
      alignment: "Ch. 3, Secs. 2-5; the modern optimizer survey is supplemental"
      slides: "/assets/pdfs/stat940_lecture_3.pdf"
      slides_label: "Lecture 3 slides"
    - title: "Lecture 4 - Model selection, empirical and true error, SURE, double descent, implicit regularization, and grokking"
      alignment: "Ch. 5, Secs. 2-5; Ch. 6, Sec. 5; optional SURE proof: Ch. 5, Sec. 13"
      slides: "/assets/pdfs/stat940_lecture_4.pdf"
      slides_label: "Lecture 4 slides"
    - title: "Lecture 5 - Regularization: weight decay, augmentation and noise injection, manifold tangent classifier, early stopping, parameter sharing, label smoothing, bagging, and dropout"
      alignment: "Ch. 5, Secs. 6-10.3; manifold tangent classifier, parameter tying/sharing, and general label smoothing are supplemental"
      slides: "/assets/pdfs/stat940_lecture_5.pdf"
      slides_label: "Lecture 5 slides"
    - title: "Lecture 6 - Dropout, double descent, batch normalization, and normalization alternatives"
      alignment: "Ch. 5, Secs. 10.3-11; Ch. 6, Sec. 5.1"
      slides: ""
    - title: "Lecture 7 - CNN foundations, convolution and pooling, ResNet/DenseNet, normalization, and architecture selection"
      alignment: "Ch. 4, Secs. 1-5.8; Ch. 5, Sec. 11"
      slides: ""
    - title: "Lecture 8 - RNNs, BPTT, vanishing/exploding gradients, LSTM, and GRU"
      alignment: "Ch. 8, Secs. 1-4.3"
      slides: ""
    - title: "Lecture 9 - Sequence-to-sequence models, attention, self-attention, and attention in vision"
      alignment: "Ch. 9, Secs. 1-2.5"
      slides: ""
    - title: "Lecture 10 - Transformer encoder/decoder, multi-head attention, feedforward blocks, and positional encoding"
      alignment: "Ch. 9, Sec. 3"
      slides: ""
    - title: "Lecture 11 - BERT, GPT, T5, and major large-language-model families"
      alignment: "Ch. 11, Secs. 1-5"
      slides: ""
    - title: "Lecture 12 - LLM alignment, SFT, reward models, RLHF, DPO, and efficient Transformer variants"
      alignment: "Ch. 11, Secs. 7-9; RL background: Ch. 18, Secs. 2 and 9; variants: Ch. 9, Sec. 4"
      slides: ""
    - title: "Lecture 13 - Performer; variational inference, ELBO, and variational autoencoders"
      alignment: "Ch. 9, Sec. 4; Ch. 12, Secs. 1-3"
      slides: ""
    - title: "Lecture 14 - GAN foundations, conditional GANs, mode collapse, adversarial autoencoders, and applications"
      alignment: "Ch. 14, Secs. 1-8; VAE comparison: Ch. 12, Sec. 3"
      slides: ""
    - title: "Lecture 15 - Diffusion models: DDPM forward/reverse processes, variational bound, and loss"
      alignment: "Ch. 15, Secs. 1-2.5"
      slides: ""
    - title: "Lecture 16 - GNN foundations, graph Fourier transform, graph convolution, and ChebNet"
      alignment: "Ch. 17, Secs. 1-3"
      slides: ""
    - title: "Lecture 17 - GCNs, neighborhood aggregation, graph learning tasks, GATs, and the Transformer connection"
      alignment: "Ch. 17, Secs. 3-6.2"
      slides: ""
    - title: "Lecture 18 - PAC/VC generalization theory, Keras implementation, and deep reinforcement learning"
      alignment: "Ch. 6, Secs. 2-3 and 5.1; Ch. 18, Secs. 1-10; coding context: Ch. 22, Secs. 2-3"
      slides: ""
  assignments: []

stat841:
  code: "STAT 841 / CM 763"
  title: "Statistical Learning - Classification"
  term: "Fall 2026"
  instructor: "Ali Ghodsi"
  instructor_office_hours: "Wednesdays, 1–2 p.m."
  instructor_office: "M3 4009"
  meetings: "4:00-5:20 p.m. (meeting days to be confirmed)"
  location: "MC 4042"
  teaching_assistants:
    - name: "Nafisat Ibrahim"
      office_hours: "Fridays, 9–10 a.m."
      location: "M3 2101"
    - name: "Jerry Zhen"
      office_hours: "Thursdays, 1–2 p.m."
      location: "M3 2101"
  description: "An in-depth graduate course on the statistical foundations, computational methods, and modern advances underlying classification and pattern recognition."
  piazza_url: "https://piazza.com/class/mtvhp1gc4782wh"
  d2l_url: "https://learn.uwaterloo.ca/"
  outline_url: "/assets/pdfs/stat841_outline.pdf"
  references_note: "There is no mandatory textbook. The following references cover substantial portions of the course:"
  references:
    - authors: "Trevor Hastie, Robert Tibshirani, and Jerome Friedman"
      title: "The Elements of Statistical Learning"
    - authors: "Christopher M. Bishop"
      title: "Pattern Recognition and Machine Learning"
    - authors: "Kevin P. Murphy"
      title: "Machine Learning: A Probabilistic Perspective"
  show_assessment_descriptions: true
  assessment_breakdown:
    - component: "Assignments"
      description: "Four individual assignments at 12.5% each"
      weight: "50%"
    - component: "Paper presentation"
      description: "Small-group presentation of a selected research paper"
      weight: "10%"
    - component: "Group final project"
      description: "Research or applied classification project"
      weight: "40%"
    - component: "Total"
      description: ""
      weight: "100%"
  assessment_dates:
    - assessment: "Assignment 1"
      release: "Monday, September 28"
      due: "Monday, October 19, 11:59 p.m."
    - assessment: "Assignment 2"
      release: "Monday, October 19"
      due: "Monday, November 9, 11:59 p.m."
    - assessment: "Assignment 3"
      release: "Monday, November 9"
      due: "Monday, November 23, 11:59 p.m."
    - assessment: "Assignment 4"
      release: "Monday, November 23"
      due: "Monday, December 7, 11:59 p.m."
    - assessment: "Paper presentation"
      release: "Paper-selection process to be announced"
      due: "Scheduled presentation date"
    - assessment: "Group final project"
      release: "To be announced"
      due: "Monday, December 21, 11:59 p.m."
  assessment_dates_note: "All dates are tentative and may change. Changes will be announced."
  lecture_schedule_note: "Lecture topics and ordering are tentative and may be adjusted during the term."
  lecture_schedule_first_heading: "Lecture"
  lecture_schedule_second_heading: "Coverage"
  show_resources: true
  resources:
    - title: "Handwritten Digits 2 and 3"
      topics:
        - "Classification"
        - "Handwritten digits"
      description: "A 64 × 400 MATLAB matrix named X containing 400 vectorized 8 × 8 handwritten-digit images. Each column is one image: columns 1–200 are examples of the digit 2, and columns 201–400 are examples of the digit 3."
      files:
        - label: "Download dataset (.mat)"
          type: "dataset"
          url: "/assets/courses/stat841/data/handwritten-digits-2-and-3.mat"
        - label: "MATLAB plotting function (.m)"
          type: "code"
          url: "/assets/courses/stat841/code/plotimages1.m"
          description: "Plots images at specified 2-D coordinates. For example, after PCA or FDA, the handwritten digits can be superimposed on their projected points to reveal patterns in the two-dimensional space."
    - title: "Classification and Feature Extraction Demo"
      topics:
        - "LDA and QDA"
        - "PCA and FDA"
        - "Logistic regression"
      description: "An interactive MATLAB demo reviewing LDA, QDA, PCA, FDA, and logistic regression using three synthetic classification datasets. It steps through feature extraction, decision boundaries, and model evaluation."
      files:
        - label: "Download MATLAB demo (.m)"
          type: "code"
          url: "/assets/courses/stat841/code/classdemo2.m"
  lecture_schedule:
    - title: "Lecture 1"
      coverage: "Course introduction; classification problems; hypothesis class, loss, and search; Bayes classifier and Bayes error"
      slides: "/assets/pdfs/stat841_lecture_1.pdf"
      slides_label: "Lecture 1 slides"
    - title: "Lecture 2"
      coverage: "Gaussian classifiers; LDA and QDA; covariance assumptions and decision boundaries"
      slides: "/assets/pdfs/stat841_lecture_2.pdf"
      slides_label: "Lecture 2 slides"
    - title: "Lecture 3"
      coverage: "Principal component analysis (PCA); variance-maximizing projections; Lagrange multipliers; covariance eigendecomposition and SVD; encoding and reconstruction"
      slides: "/assets/pdfs/stat841_lecture_3.pdf"
      slides_label: "Lecture 3 slides"
    - title: "Lecture 4"
      coverage: "PCA versus supervised class separation; Fisher's linear discriminant analysis for two and multiple classes; within- and between-class scatter; generalized eigenvalue formulation"
      slides: "/assets/pdfs/stat841_lecture_4.pdf"
      slides_label: "Lecture 4 slides"
    - title: "Lecture 5"
      coverage: "Logistic regression; binomial class probabilities; maximum likelihood; score and Hessian; Newton-Raphson and iteratively reweighted least squares (IRLS)"
      slides: "/assets/pdfs/stat841_lecture_5.pdf"
      slides_label: "Lecture 5 slides"
    - title: "Lecture 6"
      coverage: "Neural-network history; perceptron model and learning; linear separability and convergence; feedforward and deep networks; backpropagation via the chain rule; gradient-descent weight updates and epochs"
      slides: "/assets/pdfs/stat841_lecture_6.pdf"
      slides_label: "Lecture 6 slides"
    - title: "Lecture 7"
      coverage: "Model selection and complexity control; validation, cross-validation, regularization, and early stopping"
      slides: ""
    - title: "Lecture 8"
      coverage: "Radial basis function networks; localized features, training, and least-squares estimation"
      slides: ""
    - title: "Lecture 9"
      coverage: "Complexity control for RBF networks; regularization and selection of centres and bandwidths"
      slides: ""
    - title: "Lecture 10"
      coverage: "Spectral clustering and nonlinear dimensionality reduction; Laplacian eigenmaps and maximum variance unfolding"
      slides: ""
    - title: "Lecture 11"
      coverage: "Support vector machines; margins, hard-margin classification, and constrained optimization"
      slides: ""
    - title: "Lecture 12"
      coverage: "Soft-margin SVMs; slack variables, kernels, and nonlinear decision boundaries"
      slides: ""
    - title: "Lecture 13"
      coverage: "Metric learning; learned distances, embeddings, and supervised PCA"
      slides: ""
    - title: "Lecture 14"
      coverage: "Naive Bayes and k-nearest neighbours; conditional independence and local classification"
      slides: ""
    - title: "Lecture 15"
      coverage: "Convolutional neural networks; convolution, parameter sharing, equivariance, and pooling"
      slides: ""
    - title: "Lecture 16"
      coverage: "Training deep convolutional networks; regularization, random features, residual networks, and modern architectures"
      slides: ""
    - title: "Lecture 17"
      coverage: "Decision trees; recursive partitioning, splitting criteria, overfitting, and pruning"
      slides: ""
    - title: "Lecture 18"
      coverage: "Boosting; weak learners, adaptive reweighting, and stage-wise additive models"
      slides: ""
    - title: "Lecture 19"
      coverage: "Bagging, random forests, variance reduction, and ensemble comparison"
      slides: ""
    - title: "Lecture 20"
      coverage: "Semi-supervised learning, selected emerging methods, and integration of the course's main ideas"
      slides: ""
  assignments:
    - title: "STAT 841 / CM 763 — Assignment 1: Statistical Learning — Classification"
      due: "Monday, October 19, 2026, at 11:59 p.m. Toronto time"
      description: "Individual assignment · 100 marks"
      file: "/assets/courses/stat841/assignments/stat841_assignment_1.pdf"
      data_file: "/assets/courses/stat841/assignments/stat841_assignment_1_data.zip"
      details_intro: "Download the assignment PDF and the data ZIP linked above. Extract the data ZIP before starting Question 6 and keep the four CSV filenames unchanged. Read the assignment instructions carefully; the <strong>Deliverables</strong> box at the end of each question specifies exactly what to submit."
      submission_instructions:
        - label: "Crowdmark"
          text: "Upload your written solutions, tables, and figures to the corresponding assignment questions. Keep full code in your Learn submission."
        - label: "Learn"
          text: "Submit one ZIP file named <code>WatIAM_A1.zip</code> to the <strong>Assignment 1 Dropbox</strong> in Learn, replacing <code>WatIAM</code> with your Waterloo username. Include <code>Q3.py</code>, <code>Q5.py</code>, and <code>Q6.py</code> (or the corresponding <code>.R</code> or <code>.m</code> files), any required helper files, <code>Q6_cv_results.csv</code>, <code>Q6_predictions.csv</code>, and a short README giving run commands, software/dependencies, and random seeds."
      programming_note: "Use Python, R, or MATLAB and follow the programming requirements in the assignment PDF."
      learn_url: "https://learn.uwaterloo.ca/d2l/home/1289424"
      ai_survey: "Generative AI use is permitted. After completing the assignment, open Learn and select <strong>Submit → Surveys → Assignment 1: Generative AI Use Survey</strong>. Everyone must complete the survey, including students who used no generative AI; in that case, answer <strong>No</strong> to all five questions. The survey is not anonymous so completion can be checked. Your survey responses do not affect your assignment grade."
      verification: "You may be asked to complete a brief individual quiz or participate in an oral discussion about your assignment. This may include explaining your reasoning and solutions, answering related questions, or explaining and making small modifications to your submitted code. You must demonstrate your own understanding of all submitted work, including work developed with permitted generative AI assistance. These checks must be completed without generative AI or assistance from others. If you cannot demonstrate adequate understanding of your submitted work, your overall assignment mark may be reduced."
      late_policy: "Submissions received up to 24 hours after the deadline receive a 10% penalty. Submissions more than 24 hours late receive a grade of zero."
