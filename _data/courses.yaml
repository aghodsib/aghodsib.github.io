stat940:
  code: "STAT 940"
  title: "Deep Learning"
  term: "Fall 2026"
  instructor: "Ali Ghodsi"
  meetings: "Tuesdays and Thursdays, 1:00-2:20 p.m."
  location: "MC 4063"
  description: "A graduate-level course on the foundations, architectures, optimization methods, and modern applications of deep learning."
  piazza_url: "https://piazza.com/"
  d2l_url: "https://learn.uwaterloo.ca/"
  outline_url: "/assets/pdfs/stat940_outline.pdf"
  textbook:
    authors: "Benyamin Ghojogh and Ali Ghodsi"
    title: "Elements of Deep Learning"
    publisher: "Springer, 2026"
    isbn: "978-3-032-10738-1"
    format: "eBook"
    url: "https://link.springer.com/book/10.1007/978-3-032-10738-1"
  assessment_breakdown:
    - component: "Assignments"
      weight: "45%"
    - component: "Paper presentation"
      weight: "10%"
    - component: "Group final project"
      weight: "45%"
    - component: "Total"
      weight: "100%"
  assessment_dates:
    - assessment: "Assignment 1"
      release: "Monday, October 5"
      due: "Monday, October 19, 11:59 p.m."
    - assessment: "Assignment 2"
      release: "Monday, November 2"
      due: "Monday, November 16, 11:59 p.m."
    - assessment: "Assignment 3"
      release: "Monday, November 23"
      due: "Monday, December 7, 11:59 p.m."
    - assessment: "Paper presentation"
      release: "Eligible venues specified in the course outline"
      due: "Scheduled presentation date"
    - assessment: "Group final project"
      release: "To be announced"
      due: "Monday, December 21, 11:59 p.m."
  assessment_dates_note: "All dates are tentative and may change. Changes will be announced."
  topics:
    - title: "Feedforward Deep Networks"
      description: "Basic architecture and training techniques for deep neural networks."
      alignment: "Ch. 1, Secs. 2-3 and 5; Ch. 2, Secs. 2.2-2.9 and 4"
      slides: "/assets/pdfs/stat940_lecture_1.pdf"
      slides_label: "Lecture 1 slides"
    - title: "Optimization and Regularization for Training Deep Models"
      description: "Techniques to optimize training, including gradient descent, learning rate scheduling, and regularization methods like dropout and weight decay."
      alignment: "Ch. 3, Secs. 2-5; Ch. 5, Secs. 4-11; Ch. 6, Secs. 2-3"
      slides: ""
    - title: "Convolutional Neural Networks (CNNs)"
      description: "Architectures for image and spatial data processing, including convolution, pooling, and fully connected layers."
      alignment: "Ch. 4, Secs. 2-3 and 5.2-5.7"
      slides: ""
    - title: "Recurrent Neural Networks (RNNs)"
      description: "Models for sequential data, including RNNs, Long Short-Term Memory (LSTM), and Gated Recurrent Units (GRU)."
      alignment: "Ch. 8, Secs. 2-5"
      slides: ""
    - title: "Seq2Seq Models"
      description: "Sequence-to-sequence models for tasks like machine translation, using encoder-decoder architectures."
      alignment: "Ch. 9, Secs. 2.1-2.3"
      slides: ""
    - title: "Autoencoders and Variational Autoencoders"
      description: "Models for dimensionality reduction and feature learning, including basic autoencoders and Variational Autoencoders (VAEs)."
      alignment: "Ch. 12, Secs. 2-3"
      slides: ""
    - title: "Deep Generative Models"
      details:
        - label: "Moment Matching Networks"
          description: "Techniques for matching moments between data distributions."
        - label: "Generative Adversarial Networks (GANs)"
          description: "Models that generate data by training a generator and discriminator in opposition."
        - label: "Diffusion Models"
          description: "Models that generate data by learning to reverse a diffusion process, commonly used in tasks like image generation."
      alignment: "Moment matching: Ch. 13, Secs. 2-5; GANs: Ch. 14, Secs. 2-3; diffusion models: Ch. 15, Secs. 2-4"
      slides: ""
    - title: "Attention Mechanisms and Self-Attention"
      description: "Techniques to focus on relevant parts of input data, including the self-attention mechanism used in transformers."
      alignment: "Ch. 9, Secs. 2.3-4.2"
      slides: ""
    - title: "Transformers and Performers"
      description: "Transformer architectures for sequence processing and Performer variants for scaling attention mechanisms."
      alignment: "Ch. 9, Secs. 2.3-4.2"
      slides: ""
    - title: "Large Language Models (LLMs)"
      details:
        - label: "BERT and GPT"
          description: "Pre-trained models for Natural Language Processing (NLP), focusing on bidirectional and autoregressive techniques."
        - label: "Alignment Techniques"
          description: "Including Reinforcement Learning from Human Feedback (RLHF) for aligning model outputs with human preferences."
      alignment: "Ch. 11, Secs. 2-4 and 7-9"
      slides: ""
    - title: "Deep Reinforcement Learning (Optional, if time allows)"
      description: "Techniques for training agents using deep learning in reinforcement learning environments, focusing on decision-making and policy optimization."
      alignment: "Ch. 18, Secs. 2-9"
      slides: ""
    - title: "Graph Neural Networks (GNNs)"
      description: "Architectures for processing graph-structured data, including node embeddings and graph convolutions."
      alignment: "Ch. 17, Secs. 2-7"
      slides: ""
  assignments: []

