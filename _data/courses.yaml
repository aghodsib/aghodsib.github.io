stat940:
  code: "STAT 940"
  title: "Deep Learning"
  term: "Fall 2026"
  instructor: "Ali Ghodsi"
  description: "A graduate-level course on the foundations, architectures, optimization methods, and modern applications of deep learning."
  piazza_url: "https://piazza.com/"
  d2l_url: "https://learn.uwaterloo.ca/"
  lectures:
    - number: 1
      topic: "Introduction to deep learning"
      plan: "Course organization, motivation, learning representations, and the deep learning landscape."
      slides: ""
    - number: 2
      topic: "Feedforward neural networks"
      plan: "Multilayer perceptrons, activation functions, loss functions, and backpropagation."
      slides: ""
    - number: 3
      topic: "Optimization"
      plan: "Gradient-based optimization, stochastic gradient descent, momentum, and adaptive methods."
      slides: ""
    - number: 4
      topic: "Regularization"
      plan: "Generalization, weight decay, early stopping, data augmentation, and regularization strategies."
      slides: ""
    - number: 5
      topic: "Dropout and normalization"
      plan: "Dropout, batch normalization, layer normalization, and stable network training."
      slides: ""
    - number: 6
      topic: "Convolutional neural networks"
      plan: "Convolution, pooling, receptive fields, and modern CNN architectures."
      slides: ""
    - number: 7
      topic: "Practical deep learning"
      plan: "Training workflows, implementation patterns, diagnostics, and model development in Keras."
      slides: ""
    - number: 8
      topic: "Recurrent neural networks"
      plan: "Sequence modeling, recurrent networks, vanishing gradients, LSTMs, and gated units."
      slides: ""
    - number: 9
      topic: "Attention and sequence-to-sequence models"
      plan: "Encoder-decoder models, attention mechanisms, self-attention, and sequence generation."
      slides: ""
    - number: 10
      topic: "Transformers"
      plan: "Transformer architecture, positional information, multi-head attention, and efficient training."
      slides: ""
    - number: 11
      topic: "BERT and GPT"
      plan: "Pre-training objectives, fine-tuning, autoregressive models, and large language models."
      slides: ""
    - number: 12
      topic: "Deep reinforcement learning I"
      plan: "Markov decision processes, value functions, policy learning, and deep Q-networks."
      slides: ""
    - number: 13
      topic: "Deep reinforcement learning II"
      plan: "Policy gradients, actor-critic methods, exploration, and practical reinforcement learning."
      slides: ""
    - number: 14
      topic: "Alignment and RLHF"
      plan: "Instruction tuning, preference learning, reinforcement learning from human feedback, and alignment."
      slides: ""
    - number: 15
      topic: "Variational autoencoders"
      plan: "Latent-variable models, variational inference, the reparameterization trick, and VAEs."
      slides: ""
    - number: 16
      topic: "Generative adversarial networks"
      plan: "Adversarial training, GAN objectives, stability challenges, and adversarial autoencoders."
      slides: ""
    - number: 17
      topic: "Diffusion models"
      plan: "Denoising diffusion, score-based learning, sampling, and modern generative modeling."
      slides: ""
    - number: 18
      topic: "Graph neural networks I"
      plan: "Graph representations, message passing, graph convolutions, and node-level learning."
      slides: ""
    - number: 19
      topic: "Graph neural networks II"
      plan: "Graph-level prediction, attention on graphs, generative graph models, and applications."
      slides: ""
    - number: 20
      topic: "Learning theory and course synthesis"
      plan: "PAC learnability in deep learning, current limitations, and connections across the course."
      slides: ""

stat841:
  code: "STAT 841"
  title: "Statistical Learning / Classification"
  term: "Fall 2026"
  instructor: "Ali Ghodsi"
  description: "A graduate-level course on statistical classification, representation learning, regularization, kernel methods, and ensemble models."
  piazza_url: "https://piazza.com/"
  d2l_url: "https://learn.uwaterloo.ca/"
  lectures:
    - number: 1
      topic: "Introduction to classification"
      plan: "Classification problems, decision theory, Bayesian classifiers, and course organization."
      slides: ""
    - number: 2
      topic: "LDA and QDA"
      plan: "Gaussian class models, linear and quadratic decision boundaries, estimation, and assumptions."
      slides: ""
    - number: 3
      topic: "Principal component analysis"
      plan: "Variance-based dimension reduction, eigendecomposition, and the relationship to classification."
      slides: ""
    - number: 4
      topic: "Fisher discriminant analysis"
      plan: "Between-class and within-class variation, discriminant directions, and multiclass extensions."
      slides: ""
    - number: 5
      topic: "Logistic regression"
      plan: "Log-odds models, likelihood-based estimation, multiclass classification, and interpretation."
      slides: ""
    - number: 6
      topic: "Model selection"
      plan: "Bias-variance tradeoffs, validation, cross-validation, complexity, and selecting classifiers."
      slides: ""
    - number: 7
      topic: "Neural networks and backpropagation"
      plan: "Feedforward models, nonlinear decision boundaries, backpropagation, and training."
      slides: ""
    - number: 8
      topic: "Radial basis function networks"
      plan: "Basis expansions, prototype selection, fitting RBF networks, and complexity control."
      slides: ""
    - number: 9
      topic: "Regularization"
      plan: "Penalized objectives, shrinkage, sparsity, generalization, and regularized classifiers."
      slides: ""
    - number: 10
      topic: "Support vector machines"
      plan: "Maximum-margin classification, hard and soft margins, duality, and support vectors."
      slides: ""
    - number: 11
      topic: "Kernel methods"
      plan: "Kernel functions, feature spaces, kernel SVMs, and nonlinear classification."
      slides: ""
    - number: 12
      topic: "Metric learning"
      plan: "Learning distances, neighbourhood structure, similarity models, and supervised embeddings."
      slides: ""
    - number: 13
      topic: "Supervised dimension reduction"
      plan: "Supervised PCA, discriminative projections, and dimension reduction for classification."
      slides: ""
    - number: 14
      topic: "Naive Bayes and nearest neighbours"
      plan: "Conditional independence, probabilistic classification, k-nearest neighbours, and local methods."
      slides: ""
    - number: 15
      topic: "Convolutional models and random features"
      plan: "Convolutional classifiers, learned features, random projections, and random feature models."
      slides: ""
    - number: 16
      topic: "Decision trees"
      plan: "Recursive partitioning, split criteria, pruning, interpretability, and classification trees."
      slides: ""
    - number: 17
      topic: "Boosting"
      plan: "Additive models, AdaBoost, gradient boosting, margins, and practical considerations."
      slides: ""
    - number: 18
      topic: "Bagging and course synthesis"
      plan: "Bootstrap aggregation, random forests, ensemble comparison, and connections across the course."
      slides: ""
