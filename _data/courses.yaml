stat940:
  code: "STAT 940"
  title: "Deep Learning"
  term: "Fall 2026"
  instructor: "Ali Ghodsi"
  meetings: "Tuesdays and Thursdays, 1:00-2:20 p.m."
  location: "MC 4063"
  description: "A graduate-level course on the foundations, architectures, optimization methods, and modern applications of deep learning."
  piazza_url: "https://piazza.com/"
  d2l_url: "https://learn.uwaterloo.ca/"
  outline_url: "/assets/pdfs/stat940_outline.pdf"
  textbook:
    authors: "Benyamin Ghojogh and Ali Ghodsi"
    title: "Elements of Deep Learning"
    publisher: "Springer, 2026"
    isbn: "978-3-032-10738-1"
    format: "eBook"
    url: "https://link.springer.com/book/10.1007/978-3-032-10738-1"
  assessment_breakdown:
    - component: "Assignments"
      weight: "45%"
    - component: "Paper presentation"
      weight: "10%"
    - component: "Group final project"
      weight: "45%"
    - component: "Total"
      weight: "100%"
  assessment_dates:
    - assessment: "Assignment 1"
      release: "Monday, October 5"
      due: "Monday, October 19, 11:59 p.m."
    - assessment: "Assignment 2"
      release: "Monday, November 2"
      due: "Monday, November 16, 11:59 p.m."
    - assessment: "Assignment 3"
      release: "Monday, November 23"
      due: "Monday, December 7, 11:59 p.m."
    - assessment: "Paper presentation"
      release: "Eligible venues specified in the course outline"
      due: "Scheduled presentation date"
    - assessment: "Group final project"
      release: "To be announced"
      due: "Monday, December 21, 11:59 p.m."
  assessment_dates_note: "All dates are tentative and may change. Changes will be announced."
  lecture_schedule_note: "This tentative schedule follows the lecture sequence in the course materials; textbook references provide supporting readings."
  lecture_schedule:
    - title: "Lecture 1 - Motivation, history, machine-learning foundations, and a neural-network overview"
      alignment: "Ch. 1, Secs. 1-5; Ch. 2, Secs. 2.1-2.9"
      slides: "/assets/pdfs/stat940_lecture_1.pdf"
      slides_label: "Lecture 1 slides"
    - title: "Lecture 2 - McCulloch-Pitts networks, the perceptron, linear separability, and historical roots of optimization/backpropagation"
      alignment: "Ch. 2, Secs. 2.2-2.6; Ch. 3, Secs. 1-2.1"
      slides: ""
    - title: "Lecture 3 - Feedforward networks, backpropagation, SGD, mini-batches, momentum, and optimizer selection"
      alignment: "Ch. 2, Secs. 2.7-2.9; Ch. 3, Secs. 2-5"
      slides: ""
    - title: "Lecture 4 - SURE, empirical and true error, and model selection"
      alignment: "Ch. 5, Secs. 2-5; optional proof: Sec. 13"
      slides: ""
    - title: "Lecture 5 - Regularization, weight decay, augmentation, noise injection, early stopping, and ensembles"
      alignment: "Ch. 5, Secs. 6-10.2"
      slides: ""
    - title: "Lecture 6 - Dropout, double descent, batch normalization, and normalization alternatives"
      alignment: "Ch. 5, Secs. 10.3-11; Ch. 6, Sec. 5.1"
      slides: ""
    - title: "Lecture 7 - CNN foundations, convolution and pooling, ResNet/DenseNet, normalization, and architecture selection"
      alignment: "Ch. 4, Secs. 1-5.8; Ch. 5, Sec. 11"
      slides: ""
    - title: "Lecture 8 - RNNs, BPTT, vanishing/exploding gradients, LSTM, and GRU"
      alignment: "Ch. 8, Secs. 1-4.3"
      slides: ""
    - title: "Lecture 9 - Sequence-to-sequence models, attention, self-attention, and attention in vision"
      alignment: "Ch. 9, Secs. 1-2.5"
      slides: ""
    - title: "Lecture 10 - Transformer encoder/decoder, multi-head attention, feedforward blocks, and positional encoding"
      alignment: "Ch. 9, Sec. 3"
      slides: ""
    - title: "Lecture 11 - BERT, GPT, T5, and major large-language-model families"
      alignment: "Ch. 11, Secs. 1-5"
      slides: ""
    - title: "Lecture 12 - LLM alignment, SFT, reward models, RLHF, DPO, and efficient Transformer variants"
      alignment: "Ch. 11, Secs. 7-9; RL background: Ch. 18, Secs. 2 and 9; variants: Ch. 9, Sec. 4"
      slides: ""
    - title: "Lecture 13 - Performer; variational inference, ELBO, and variational autoencoders"
      alignment: "Ch. 9, Sec. 4; Ch. 12, Secs. 1-3"
      slides: ""
    - title: "Lecture 14 - GAN foundations, conditional GANs, mode collapse, adversarial autoencoders, and applications"
      alignment: "Ch. 14, Secs. 1-8; VAE comparison: Ch. 12, Sec. 3"
      slides: ""
    - title: "Lecture 15 - Diffusion models: DDPM forward/reverse processes, variational bound, and loss"
      alignment: "Ch. 15, Secs. 1-2.5"
      slides: ""
    - title: "Lecture 16 - GNN foundations, graph Fourier transform, graph convolution, and ChebNet"
      alignment: "Ch. 17, Secs. 1-3"
      slides: ""
    - title: "Lecture 17 - GCNs, neighborhood aggregation, graph learning tasks, GATs, and the Transformer connection"
      alignment: "Ch. 17, Secs. 3-6.2"
      slides: ""
    - title: "Lecture 18 - PAC/VC generalization theory, Keras implementation, and deep reinforcement learning"
      alignment: "Ch. 6, Secs. 2-3 and 5.1; Ch. 18, Secs. 1-10; coding context: Ch. 22, Secs. 2-3"
      slides: ""
  assignments: []

stat841:
  code: "STAT 841 / CM 763"
  title: "Statistical Learning - Classification"
  term: "Fall 2026"
  instructor: "Ali Ghodsi"
  meetings: "4:00-5:20 p.m. (meeting days to be confirmed)"
  location: "MC 4042"
  description: "An in-depth graduate course on the statistical foundations, computational methods, and modern advances underlying classification and pattern recognition."
  piazza_url: "https://piazza.com/"
  d2l_url: "https://learn.uwaterloo.ca/"
  outline_url: "/assets/pdfs/stat841_outline.pdf"
  references_note: "There is no mandatory textbook. The following references cover substantial portions of the course:"
  references:
    - authors: "Trevor Hastie, Robert Tibshirani, and Jerome Friedman"
      title: "The Elements of Statistical Learning"
    - authors: "Christopher M. Bishop"
      title: "Pattern Recognition and Machine Learning"
    - authors: "Kevin P. Murphy"
      title: "Machine Learning: A Probabilistic Perspective"
  show_assessment_descriptions: true
  assessment_breakdown:
    - component: "Assignments"
      description: "Four individual assignments at 12.5% each"
      weight: "50%"
    - component: "Paper presentation"
      description: "Small-group presentation of a selected research paper"
      weight: "10%"
    - component: "Group final project"
      description: "Research or applied classification project"
      weight: "40%"
    - component: "Total"
      description: ""
      weight: "100%"
  assessment_dates:
    - assessment: "Assignment 1"
      release: "Monday, September 28"
      due: "Monday, October 19, 11:59 p.m."
    - assessment: "Assignment 2"
      release: "Monday, October 19"
      due: "Monday, November 9, 11:59 p.m."
    - assessment: "Assignment 3"
      release: "Monday, November 9"
      due: "Monday, November 23, 11:59 p.m."
    - assessment: "Assignment 4"
      release: "Monday, November 23"
      due: "Monday, December 7, 11:59 p.m."
    - assessment: "Paper presentation"
      release: "Paper-selection process to be announced"
      due: "Scheduled presentation date"
    - assessment: "Group final project"
      release: "To be announced"
      due: "Monday, December 21, 11:59 p.m."
  assessment_dates_note: "All dates are tentative and may change. Changes will be announced."
  lecture_schedule_note: "Lecture topics and ordering are tentative and may be adjusted during the term."
  lecture_schedule_first_heading: "Lecture"
  lecture_schedule_second_heading: "Coverage"
  lecture_schedule:
    - title: "Lecture 1"
      coverage: "Course introduction; classification problems; hypothesis class, loss, and search; Bayes classifier and Bayes error"
      slides: ""
    - title: "Lecture 2"
      coverage: "Gaussian classifiers; LDA and QDA; covariance assumptions and decision boundaries"
      slides: ""
    - title: "Lecture 3"
      coverage: "Dimensionality reduction and feature extraction; PCA and Fisher discriminant analysis"
      slides: ""
    - title: "Lecture 4"
      coverage: "Logistic regression; likelihood, probabilistic classification, and optimization"
      slides: ""
    - title: "Lecture 5"
      coverage: "Perceptrons and feedforward neural networks; linear separability and model capacity"
      slides: ""
    - title: "Lecture 6"
      coverage: "Backpropagation; computational graphs; gradient descent and stochastic optimization"
      slides: ""
    - title: "Lecture 7"
      coverage: "Model selection and complexity control; validation, cross-validation, regularization, and early stopping"
      slides: ""
    - title: "Lecture 8"
      coverage: "Radial basis function networks; localized features, training, and least-squares estimation"
      slides: ""
    - title: "Lecture 9"
      coverage: "Complexity control for RBF networks; regularization and selection of centres and bandwidths"
      slides: ""
    - title: "Lecture 10"
      coverage: "Spectral clustering and nonlinear dimensionality reduction; Laplacian eigenmaps and maximum variance unfolding"
      slides: ""
    - title: "Lecture 11"
      coverage: "Support vector machines; margins, hard-margin classification, and constrained optimization"
      slides: ""
    - title: "Lecture 12"
      coverage: "Soft-margin SVMs; slack variables, kernels, and nonlinear decision boundaries"
      slides: ""
    - title: "Lecture 13"
      coverage: "Metric learning; learned distances, embeddings, and supervised PCA"
      slides: ""
    - title: "Lecture 14"
      coverage: "Naive Bayes and k-nearest neighbours; conditional independence and local classification"
      slides: ""
    - title: "Lecture 15"
      coverage: "Convolutional neural networks; convolution, parameter sharing, equivariance, and pooling"
      slides: ""
    - title: "Lecture 16"
      coverage: "Training deep convolutional networks; regularization, random features, residual networks, and modern architectures"
      slides: ""
    - title: "Lecture 17"
      coverage: "Decision trees; recursive partitioning, splitting criteria, overfitting, and pruning"
      slides: ""
    - title: "Lecture 18"
      coverage: "Boosting; weak learners, adaptive reweighting, and stage-wise additive models"
      slides: ""
    - title: "Lecture 19"
      coverage: "Bagging, random forests, variance reduction, and ensemble comparison"
      slides: ""
    - title: "Lecture 20"
      coverage: "Semi-supervised learning, selected emerging methods, and integration of the course's main ideas"
      slides: ""
  assignments: []
